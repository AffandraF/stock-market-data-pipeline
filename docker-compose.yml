version: '3.8'

services:
  warehouse-postgres:
    image: postgres:15-alpine
    container_name: warehouse-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stock_pipeline_net

  airflow-init:
    image: apache/airflow:2.9.2-python3.11
    container_name: airflow-init
    depends_on:
      - warehouse-postgres
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@warehouse-postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - _PIP_ADDITIONAL_REQUIREMENTS=yfinance pandas psycopg2-binary duckdb sqlalchemy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./utils:/opt/airflow/utils
      - ./data:/opt/airflow/data
      - ./sql:/opt/airflow/sql
    networks:
      - stock_pipeline_net

  airflow-webserver:
    image: apache/airflow:2.9.2-python3.11
    container_name: airflow-webserver
    depends_on:
      - warehouse-postgres
    restart: always
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@warehouse-postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=yfinance pandas psycopg2-binary duckdb sqlalchemy
      # For import resolution inside DAGs
      - PYTHONPATH=/opt/airflow/src:/opt/airflow
      # Configuration pass-throughs
      - POSTGRES_HOST=warehouse-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RAW_DATA_PATH=/opt/airflow/data/raw
      - PROCESSED_DATA_PATH=/opt/airflow/data/processed
      - STOCK_TICKERS=${STOCK_TICKERS}
    ports:
      - "8080:8080"
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./utils:/opt/airflow/utils
      - ./data:/opt/airflow/data
      - ./sql:/opt/airflow/sql
    networks:
      - stock_pipeline_net

  airflow-scheduler:
    image: apache/airflow:2.9.2-python3.11
    container_name: airflow-scheduler
    depends_on:
      - warehouse-postgres
    restart: always
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@warehouse-postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=yfinance pandas psycopg2-binary duckdb sqlalchemy
      # For import resolution inside DAGs
      - PYTHONPATH=/opt/airflow/src:/opt/airflow
      # Configuration pass-throughs
      - POSTGRES_HOST=warehouse-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RAW_DATA_PATH=/opt/airflow/data/raw
      - PROCESSED_DATA_PATH=/opt/airflow/data/processed
      - STOCK_TICKERS=${STOCK_TICKERS}
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./utils:/opt/airflow/utils
      - ./data:/opt/airflow/data
      - ./sql:/opt/airflow/sql
    networks:
      - stock_pipeline_net

volumes:
  postgres_data:

networks:
  stock_pipeline_net:
    driver: bridge